name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write      # required by actions/attest-build-provenance (OIDC)
  attestations: write  # required to persist attestations to the repo store

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      # Thin-shell release repo: the source of truth is the monorepo
      # (dreamor/memvault, obsidian-plugin/). It is public, so checking it
      # out needs no token; anything the portal review requires at repo
      # root stays resident here (README/LICENSE/manifest.json/versions.json).
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dreamor/memvault
          path: mono

      - name: Verify tag agrees with both manifests (shell + monorepo)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./manifest.json').version")
          ver_mono=$(node -p "require('./mono/obsidian-plugin/manifest.json').version")
          if [ "$tag" != "$ver" ] || [ "$tag" != "$ver_mono" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} / shell manifest ${ver} / monorepo manifest ${ver_mono} disagree"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mono/obsidian-plugin
        run: npm ci

      - name: Typecheck
        working-directory: mono/obsidian-plugin
        run: npm run typecheck

      - name: Build
        working-directory: mono/obsidian-plugin
        run: npm run build

      - name: Stage assets at workspace root
        run: |
          mkdir -p out
          cp mono/obsidian-plugin/out/main.js out/main.js
          cp mono/obsidian-plugin/styles.css styles.css
          cp mono/obsidian-plugin/manifest.json manifest.json

      # Cryptographic build provenance for the release assets (requested by
      # the community directory review). Attestations attach to the repo's
      # attestation store — verify with `gh attestation verify <file>`.
      - name: Attach build provenance attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            out/main.js
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/main.js
            manifest.json
            styles.css
          generate_release_notes: true
