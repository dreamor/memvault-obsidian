name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write      # required by actions/attest-build-provenance (OIDC)
  attestations: write  # required to persist attestations to the repo store

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${ver}"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Cryptographic build provenance for the release assets (requested by
      # the community directory review). Attestations attach to the repo's
      # attestation store — verify with `gh attestation verify <file>`.
      - name: Attach build provenance attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            out/main.js
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/main.js
            manifest.json
            styles.css
          generate_release_notes: true
